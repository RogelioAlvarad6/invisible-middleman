# Rebuild the scenarios, run both test suites, and publish the visualizer to GitHub Pages
# on every push to main.
name: Test and deploy visualizer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python scenarios/build_scenarios.py
      - run: uv run python scenarios/export_timelines.py
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: visualizer
      - run: npm test
        working-directory: visualizer
      - run: npm run build
        working-directory: visualizer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: visualizer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
