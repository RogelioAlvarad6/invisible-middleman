[project]
name = "invisible-middleman"
version = "0.1.0"
description = "Detector and teaching visualizer for layer-2 trust attacks on dual-stack (IPv4 + IPv6) LANs"
readme = "README.md"
authors = [
    { name = "Rogelio Alvarado-Diaz" }
]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "scapy>=2.8.0",
]

[project.scripts]
invisible-middleman = "invisible_middleman.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
